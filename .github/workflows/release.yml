name: Release

# Every push to main (every merged PR) tests, builds a DMG and publishes it as a GitHub release
# tagged v<VERSION>(<run number>), e.g. v0.1.0(12). Installed apps update themselves from it.
on:
  push:
    branches: [main]
    # Website-only changes don't need a new app release.
    paths-ignore: [site/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted Apple-silicon runner, free for public repositories.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: |
          xcodebuild -project Overseer.xcodeproj -scheme Overseer -destination 'platform=macOS' \
            -derivedDataPath build/TestData CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            test -quiet

      - name: Build DMG
        id: build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DMG="$(./scripts/build-dmg.sh | tail -n 1)"
          {
            echo "tag=v$VERSION($BUILD_NUMBER)"
            echo "dmg=$DMG"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          DMG: ${{ steps.build.outputs.dmg }}
        run: |
          gh release create "$TAG" "$DMG" \
            --target "$GITHUB_SHA" \
            --title "Overseer $TAG" \
            --generate-notes
